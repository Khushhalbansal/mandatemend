[project]
name = "mandatemend"
version = "0.1.0"
description = "UPI AutoPay / e-mandate failure-recovery agent (Razorpay AI Buildathon, Track 03)"
requires-python = ">=3.11"

# Dependency hygiene (CLAUDE.md §6): minimal, maintained, money-handling core kept small.
# pyproject declares compatible floors; `requirements-lock.txt` is the exact validated set
# (what CI installs and what a clean checkout should use for a byte-reproducible scorecard).
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "SQLAlchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "jinja2>=3.1.4,<4",
    "python-dotenv>=1.0,<2",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "lifelines>=0.29,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
]
llm = [
    "anthropic>=0.34,<1",
]

[project.scripts]
mandatemend = "mandatemend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) allowed in tests; compliance invariants use assert by design (CLAUDE.md §1.3);
# db/session.py uses assert only for post-init type-narrowing.
# cli.py only ever shells out to this repo's own dev tools (pytest/ruff/mypy/git) with a
# fixed argv — S603/S607 don't apply.
per-file-ignores = { "tests/**" = [
    "S101",
], "src/mandatemend/invariants.py" = [
    "S101",
], "src/mandatemend/db/session.py" = [
    "S101",
], "src/mandatemend/cli.py" = [
    "S603",
    "S607",
] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests hit the real Razorpay test-mode API (network) — opt in with `pytest -m live`.
addopts = ["-m", "not live"]
markers = [
    "integration: needs a database",
    "e2e: full frozen-batch run",
    "llm: needs ANTHROPIC_API_KEY",
    "live: hits the real Razorpay test-mode API over the network",
]

[tool.mypy]
python_version = "3.12"
packages = ["mandatemend"]
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]
exclude = ["tests/"]
