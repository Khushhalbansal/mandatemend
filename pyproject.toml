[project]
name = "mandatemend"
version = "0.1.0"
description = "UPI AutoPay / e-mandate failure-recovery agent (Razorpay AI Buildathon, Track 03)"
requires-python = ">=3.11"

# Dependency hygiene (CLAUDE.md §6): pinned, maintained, minimal for money-handling core.
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "SQLAlchemy==2.0.35",
    "psycopg[binary]==3.2.3",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "jinja2==3.1.4",
    "python-dotenv==1.0.1",
    "numpy==2.1.1",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "lifelines==0.29.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
]
llm = [
    "anthropic==0.34.2",
]

[project.scripts]
mandatemend = "mandatemend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) allowed in tests; compliance invariants use assert by design (CLAUDE.md §1.3);
# db/session.py uses assert only for post-init type-narrowing.
# cli.py only ever shells out to this repo's own dev tools (pytest/ruff/mypy/git) with a
# fixed argv — S603/S607 don't apply.
per-file-ignores = { "tests/**" = [
    "S101",
], "src/mandatemend/invariants.py" = [
    "S101",
], "src/mandatemend/db/session.py" = [
    "S101",
], "src/mandatemend/cli.py" = [
    "S603",
    "S607",
] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests hit the real Razorpay test-mode API (network) — opt in with `pytest -m live`.
addopts = ["-m", "not live"]
markers = [
    "integration: needs a database",
    "e2e: full frozen-batch run",
    "llm: needs ANTHROPIC_API_KEY",
    "live: hits the real Razorpay test-mode API over the network",
]

[tool.mypy]
python_version = "3.12"
packages = ["mandatemend"]
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]
exclude = ["tests/"]
