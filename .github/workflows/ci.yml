name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Deterministic runs: single-thread the GBM histogram reductions (their parallel float
  # accumulation order isn't bit-stable across thread counts) and pin the hash seed.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Validated locally on 3.13; CI also covers 3.12. (requirements-lock.txt is frozen
        # from a 3.13 env; older interpreters may not have wheels for every pinned version.)
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (exact locked set + package)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Generate the training set (the 300-mandate held-out batch is committed, frozen)
        run: python data/generator.py

      - name: Lint (ruff)
        run: ruff check src data tests

      - name: Types (mypy)
        run: mypy

      - name: Tests — unit
        run: bash .github/run-tests.sh unit tests/unit --tb=long

      - name: Tests — integration
        run: bash .github/run-tests.sh integration tests/integration --tb=short

      - name: Tests — property (Hypothesis safety proofs, opt-in marker)
        run: bash .github/run-tests.sh property tests/property --tb=short -m property

      - name: Red-team adversarial battery (injection corpus, fuzzing, concurrency)
        # Independent of pytest: prints a detection rate per group and exits non-zero if any
        # group fails to hold. Gate on the full safety story, not just the unit slice.
        run: python -c "import sys; from mandatemend.cli import main; sys.exit(main(['redteam']))"

      - name: Tests — e2e + coverage gate
        run: bash .github/run-tests.sh e2e "" --tb=short --cov=mandatemend --cov-report=term-missing --cov-fail-under=85

      - name: Full pipeline — train then score the frozen batch
        # `mandatemend score` exits non-zero if compliance_violations > 0, so this step is a
        # hard gate on the STOP-THE-LINE invariant (CLAUDE.md §3.1).
        run: |
          mandatemend train
          mandatemend score --fast --no-log --note "CI ${{ matrix.python-version }}"

      - name: Verify frozen batches are untouched (primary + v2)
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          rec = dict(
              line.split()
              for line in pathlib.Path("data/FROZEN_SHA256.txt").read_text().splitlines()
              if line.strip()
          )
          bad = []
          for name in (
              "heldout_batch.frozen.json", "heldout_labels.frozen.json",
              "heldout_batch_v2.frozen.json", "heldout_labels_v2.frozen.json",
              "heldout_reauth_v2.frozen.json",
          ):
              got = hashlib.sha256(pathlib.Path("data", name).read_bytes()).hexdigest()
              if got != rec[name]:
                  bad.append(f"{name}: {got} != {rec[name]}")
          if bad:
              sys.exit("FROZEN BATCH CHANGED:\n" + "\n".join(bad))
          print("frozen batches intact (primary + v2)")
          PY
