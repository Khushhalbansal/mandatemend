name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Deterministic runs: single-thread the GBM histogram reductions (their parallel float
  # accumulation order isn't bit-stable across thread counts) and pin the hash seed.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Validated locally on 3.13; CI also covers 3.12. (requirements-lock.txt is frozen
        # from a 3.13 env; older interpreters may not have wheels for every pinned version.)
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (exact locked set + package)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Generate the training set (the 300-mandate held-out batch is committed, frozen)
        run: python data/generator.py

      - name: Lint (ruff)
        run: ruff check src data tests

      - name: Types (mypy)
        run: mypy

      - name: Tests — unit
        run: pytest -q -rA tests/unit

      - name: Tests — integration
        run: pytest -q -rA tests/integration

      - name: Tests — e2e + coverage gate
        run: pytest -q -rA --cov=mandatemend --cov-report=term-missing --cov-fail-under=85

      - name: Full pipeline — train then score the frozen batch
        # `mandatemend score` exits non-zero if compliance_violations > 0, so this step is a
        # hard gate on the STOP-THE-LINE invariant (CLAUDE.md §3.1).
        run: |
          mandatemend train
          mandatemend score --fast --no-log --note "CI ${{ matrix.python-version }}"

      - name: Verify frozen batch is untouched
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          rec = dict(
              line.split()
              for line in pathlib.Path("data/FROZEN_SHA256.txt").read_text().splitlines()
              if line.strip()
          )
          bad = []
          for name in ("heldout_batch.frozen.json", "heldout_labels.frozen.json"):
              got = hashlib.sha256(pathlib.Path("data", name).read_bytes()).hexdigest()
              if got != rec[name]:
                  bad.append(f"{name}: {got} != {rec[name]}")
          if bad:
              sys.exit("FROZEN BATCH CHANGED:\n" + "\n".join(bad))
          print("frozen batch intact")
          PY
