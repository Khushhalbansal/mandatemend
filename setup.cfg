# Mutation-testing config (on-demand, not part of CI — see docs/INVARIANTS.md).
#   pip install "mutmut==2.5.1"      # 3.x drops native-Windows support
#   mutmut run                       # mutates the policy layer + the independent checker
#   mutmut results                   # kill-rate + surviving-mutant ids
# The runner is scoped to the fast, deterministic unit tests that exercise those modules so
# each mutant is graded in ~1s.
[mutmut]
paths_to_mutate = src/mandatemend/policy/rules.py,src/mandatemend/policy/engine.py,src/mandatemend/invariants.py
runner = python -m pytest -x -q --no-header -p no:cacheprovider tests/unit/test_policy_rules.py tests/unit/test_policy_engine.py tests/unit/test_invariants.py tests/unit/test_diagnosers.py
tests_dir = tests/
