# Postgres for the idempotency layer. Chosen over SQLite deliberately (CLAUDE.md §2/§3.1):
# idempotency correctness under concurrent webhooks needs a real DB-level unique constraint
# with proper transaction isolation. This is the specific weakness the closest competitor
# repo admits to ("SQLite cannot support strict durable WAL-locking ... at scale").
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: mandatemend
      POSTGRES_PASSWORD: mandatemend
      POSTGRES_DB: mandatemend
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandatemend"]
      interval: 3s
      timeout: 3s
      retries: 10
